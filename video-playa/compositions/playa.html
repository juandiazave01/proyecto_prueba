<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #1c1530;
    }
    #playa-canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }
    #playa-titles {
      position: absolute;
      left: 0;
      right: 0;
      top: 170px;
      text-align: center;
      color: #fff4e6;
      text-shadow: 0 2px 24px rgba(120, 40, 30, 0.45);
    }
    #playa-title {
      font-family: "Playfair Display", serif;
      font-weight: 400;
      font-size: 104px;
      letter-spacing: -0.01em;
      line-height: 1.05;
    }
    #playa-sub {
      margin-top: 22px;
      font-family: "Montserrat", sans-serif;
      font-weight: 500;
      font-size: 30px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      opacity: 0.85;
    }
  </style>
  <div
    id="root"
    data-composition-id="playa"
    data-width="1920"
    data-height="1080"
    data-composition-variables='[{"id":"titulo","type":"string","label":"Título","default":"Juntos, paso a paso"},{"id":"subtitulo","type":"string","label":"Subtítulo","default":"Papá & hija"}]'
  >
    <canvas id="playa-canvas" width="1920" height="1080"></canvas>
    <div id="playa-titles" class="clip" data-start="11.6" data-duration="4.4" data-track-index="2">
      <div id="playa-title" data-var-text="titulo">Juntos, paso a paso</div>
      <div id="playa-sub" data-var-text="subtitulo">Papá &amp; hija</div>
    </div>
  </div>
  <script>
    (function () {
      const W = 1920, H = 1080;
      const DUR = 16;
      const canvas = document.getElementById("playa-canvas");
      const ctx = canvas.getContext("2d");

      // ---------- helpers ----------
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const smooth = (e0, e1, x) => {
        const t = clamp((x - e0) / (e1 - e0), 0, 1);
        return t * t * (3 - 2 * t);
      };
      const lerp = (a, b, t) => a + (b - a) * t;
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      // ---------- world layout ----------
      const HORIZON = 585;
      const SHORE = 735;      // where the sea meets the sand (calm)
      const DAD_Y = 868;      // dad's feet
      const GIRL_Y = 892;     // girl's feet (nearer the camera)
      const SPEED = 200;      // px / s, a slow stroll
      const X0 = -120;        // dad's world x at t = 0
      const dadX = (t) => X0 + SPEED * t;

      // camera pan speed ramps in at 2.0-3.6 s and out at 9.6-11.4 s
      const camV = (t) => SPEED * smooth(2.0, 3.6, t) * (1 - smooth(9.6, 11.4, t));
      const CAM_STEP = 1 / 120;
      const camTable = [0];
      for (let i = 1; i <= DUR / CAM_STEP + 2; i++) {
        const t = i * CAM_STEP;
        camTable.push(camTable[i - 1] + camV(t - CAM_STEP / 2) * CAM_STEP);
      }
      const camX = (t) => {
        const f = clamp(t, 0, DUR) / CAM_STEP;
        const i = Math.floor(f);
        return lerp(camTable[i], camTable[Math.min(i + 1, camTable.length - 1)], f - i);
      };

      // ---------- figures ----------
      const DAD = { leg: 160, torso: 118, neck: 14, head: 23, upperArm: 74, foreArm: 72, amp: 0.25, width: 44 };
      const GIRL = { leg: 92, torso: 68, neck: 8, head: 18, upperArm: 40, foreArm: 37, amp: 0.31, width: 28 };
      // cycle length so the stance foot stays put on the sand (no sliding)
      DAD.cycle = 2 * Math.PI * DAD.amp * DAD.leg;
      GIRL.cycle = 2 * Math.PI * GIRL.amp * GIRL.leg;
      const GIRL_AHEAD = 100; // girl walks slightly ahead of dad

      function legPose(P, q) {
        const thigh = P.amp * Math.sin(q);
        const swing = Math.max(0, Math.cos(q)); // moving forward
        const knee = 0.6 * Math.pow(swing, 1.4) * Math.max(0, Math.sin(q + 1.2) + 0.4);
        const t1 = P.leg * 0.52, t2 = P.leg * 0.48;
        const kx = t1 * Math.sin(thigh), ky = t1 * Math.cos(thigh);
        const sh = thigh - knee;
        const fx = kx + t2 * Math.sin(sh), fy = ky + t2 * Math.cos(sh);
        return { kx, ky, fx, fy };
      }

      function ik(sx, sy, tx, ty, l1, l2, bend) {
        let dx = tx - sx, dy = ty - sy;
        let d = Math.hypot(dx, dy);
        const maxD = l1 + l2 - 0.5;
        if (d > maxD) { dx *= maxD / d; dy *= maxD / d; d = maxD; }
        const a = Math.atan2(dy, dx);
        const cosA = clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1);
        const ang = a + bend * Math.acos(cosA);
        return { ex: sx + l1 * Math.cos(ang), ey: sy + l1 * Math.sin(ang), hx: sx + dx, hy: sy + dy };
      }

      function limb(points, w) {
        ctx.lineWidth = w;
        ctx.beginPath();
        ctx.moveTo(points[0], points[1]);
        for (let i = 2; i < points.length; i += 2) ctx.lineTo(points[i], points[i + 1]);
        ctx.stroke();
      }

      // pose of a walker at world x and phase p; returns key joints in local coords (feet at y=0)
      function walkerPose(P, p, lift) {
        const A = legPose(P, p), B = legPose(P, p + Math.PI);
        const hipY = -Math.max(A.fy, B.fy) - lift;
        const bodyLean = 0.05;
        const shX = hipY * -Math.sin(bodyLean) * 0 + P.torso * Math.sin(bodyLean);
        const shY = hipY - P.torso;
        return { A, B, hipY, shX, shY };
      }

      function drawDad(x, y, p, handTarget, color) {
        const P = DAD;
        const s = walkerPose(P, p, 0);
        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = color; ctx.fillStyle = color;
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        // far arm (swings opposite the far leg B)
        const farA = -0.32 * Math.sin(p + Math.PI);
        const ex = s.shX + P.upperArm * Math.sin(farA), ey = s.shY + P.upperArm * Math.cos(farA);
        const fa = farA + 0.25 + 0.15 * Math.max(0, Math.sin(p));
        limb([s.shX - 4, s.shY + 6, ex, ey, ex + P.foreArm * Math.sin(fa), ey + P.foreArm * Math.cos(fa)], 15);
        // far leg B
        limb([0, s.hipY, s.B.kx, s.hipY + s.B.ky, s.B.fx, s.hipY + s.B.fy], 21);
        limb([s.B.fx, s.hipY + s.B.fy - 3, s.B.fx + 20, s.hipY + s.B.fy - 2], 9);
        // near leg A
        limb([0, s.hipY, s.A.kx, s.hipY + s.A.ky, s.A.fx, s.hipY + s.A.fy], 22);
        limb([s.A.fx, s.hipY + s.A.fy - 3, s.A.fx + 21, s.hipY + s.A.fy - 2], 10);
        // shorts
        ctx.beginPath();
        ctx.moveTo(-P.width / 2 + 2, s.hipY - 14);
        ctx.lineTo(P.width / 2 - 2, s.hipY - 14);
        ctx.lineTo(s.A.kx * 0.55 + 12, s.hipY + s.A.ky * 0.55);
        ctx.lineTo(s.B.kx * 0.55 - 12, s.hipY + s.B.ky * 0.55);
        ctx.closePath(); ctx.fill();
        // torso
        ctx.beginPath();
        ctx.moveTo(-P.width / 2 + 3, s.hipY - 4);
        ctx.quadraticCurveTo(-P.width / 2 - 4, s.shY + 40, s.shX - P.width / 2 + 2, s.shY + 6);
        ctx.quadraticCurveTo(s.shX, s.shY - 6, s.shX + P.width / 2 - 2, s.shY + 6);
        ctx.quadraticCurveTo(P.width / 2 + 6, s.shY + 50, P.width / 2 - 3, s.hipY - 4);
        ctx.closePath(); ctx.fill();
        // neck + head
        const hx = s.shX + 4, hy = s.shY - P.neck - P.head + 2;
        limb([s.shX + 1, s.shY + 2, hx, hy + P.head * 0.6], 15);
        ctx.beginPath(); ctx.ellipse(hx, hy, P.head * 0.92, P.head, 0, 0, Math.PI * 2); ctx.fill();
        // nose + short hair
        ctx.beginPath(); ctx.ellipse(hx + P.head * 0.86, hy + 3, 5, 6, 0, 0, Math.PI * 2); ctx.fill();
        // near arm holds the girl's hand
        const sx = s.shX + 2, sy = s.shY + 8;
        const r = ik(sx, sy, handTarget.x - x, handTarget.y - y, P.upperArm, P.foreArm, 1);
        limb([sx, sy, r.ex, r.ey, r.hx, r.hy], 16);
        ctx.beginPath(); ctx.arc(r.hx, r.hy, 8, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        return { shoulder: { x: x + sx, y: y + sy } };
      }

      function dadShoulder(x, y, p) {
        const s = walkerPose(DAD, p, 0);
        return { x: x + s.shX + 2, y: y + s.shY + 8 };
      }

      function drawGirl(x, y, p, lift, handTarget, t, color) {
        const P = GIRL;
        const s = walkerPose(P, p, lift);
        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = color; ctx.fillStyle = color;
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        // far arm swings freely
        const farA = -0.45 * Math.sin(p + Math.PI);
        const ex = s.shX + P.upperArm * Math.sin(farA), ey = s.shY + P.upperArm * Math.cos(farA);
        const fa = farA + 0.35;
        limb([s.shX - 2, s.shY + 4, ex, ey, ex + P.foreArm * Math.sin(fa), ey + P.foreArm * Math.cos(fa)], 9);
        // legs
        limb([0, s.hipY, s.B.kx, s.hipY + s.B.ky, s.B.fx, s.hipY + s.B.fy], 12);
        limb([s.B.fx, s.hipY + s.B.fy - 2, s.B.fx + 12, s.hipY + s.B.fy - 1], 6);
        limb([0, s.hipY, s.A.kx, s.hipY + s.A.ky, s.A.fx, s.hipY + s.A.fy], 12.5);
        limb([s.A.fx, s.hipY + s.A.fy - 2, s.A.fx + 13, s.hipY + s.A.fy - 1], 6.5);
        // dress: swings behind the motion (follow-through)
        const sway = 0.12 * Math.sin(p * 2 - 0.9) + (lift > 0 ? -0.05 * lift / 10 : 0);
        const hemY = s.hipY + 26;
        ctx.beginPath();
        ctx.moveTo(s.shX - 9, s.shY + 4);
        ctx.lineTo(s.shX + 10, s.shY + 4);
        ctx.quadraticCurveTo(14, s.hipY - 10, 26 + sway * -40, hemY + sway * 6);
        ctx.quadraticCurveTo(0, hemY + 5, -28 + sway * -40, hemY - sway * 6);
        ctx.quadraticCurveTo(-12, s.hipY - 10, s.shX - 9, s.shY + 4);
        ctx.fill();
        // head
        const hx = s.shX + 3, hy = s.shY - P.neck - P.head + 3;
        limb([s.shX, s.shY + 2, hx, hy + 10], 9);
        ctx.beginPath(); ctx.arc(hx, hy, P.head, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(hx + P.head * 0.86, hy + 3, 3.5, 4.5, 0, 0, Math.PI * 2); ctx.fill();
        // ponytail: lags the bounce
        const bob = -s.hipY;
        const lag = Math.sin(p * 2 - 1.6) * 0.35 + lift * 0.03;
        const tx0 = hx - P.head * 0.8, ty0 = hy - P.head * 0.55;
        ctx.beginPath(); ctx.arc(tx0 + 2, ty0 + 2, 6, 0, Math.PI * 2); ctx.fill();
        ctx.lineWidth = 9;
        ctx.beginPath();
        ctx.moveTo(tx0, ty0);
        const ang = 2.45 + lag; // pointing back and down
        ctx.quadraticCurveTo(tx0 + 16 * Math.cos(ang - 0.4), ty0 + 16 * Math.sin(ang - 0.4) - 6,
          tx0 + 30 * Math.cos(ang), ty0 + 30 * Math.sin(ang));
        ctx.stroke();
        // near arm reaches up to dad's hand
        const sx = s.shX + 2, sy = s.shY + 6;
        const r = ik(sx, sy, handTarget.x - x, handTarget.y - y, P.upperArm, P.foreArm, -1);
        limb([sx, sy, r.ex, r.ey, r.hx, r.hy], 9.5);
        ctx.restore();
        return { shoulder: { x: x + sx, y: y + sy }, bob };
      }

      function girlShoulder(x, y, p, lift) {
        const s = walkerPose(GIRL, p, lift);
        return { x: x + s.shX + 2, y: y + s.shY + 6 };
      }

      // girl's little skip around 6.4-7.4 s: two hops
      const girlLift = (t) => {
        if (t < 6.4 || t > 7.4) return 0;
        const u = (t - 6.4) / 0.5;
        return 20 * Math.max(0, Math.sin(Math.PI * (u % 1))) * (u < 1 ? 1 : 0.75);
      };

      // ---------- waves ----------
      // each wash: start time, peak reach (y at the foam edge)
      const WAVES = [
        { s: -2.0, reach: 830 }, { s: 1.6, reach: 852 }, { s: 5.4, reach: 826 },
        { s: 8.6, reach: 848 }, { s: 11.9, reach: 935 }, { s: 15.6, reach: 830 },
      ];
      const RUN_UP = 1.7, BACK = 2.4;
      function waveProgress(w, t) {
        const u = t - w.s;
        if (u < 0 || u > RUN_UP + BACK) return 0;
        if (u < RUN_UP) { const k = u / RUN_UP; return 1 - Math.pow(1 - k, 2.4); }
        const k = (u - RUN_UP) / BACK; return 1 - k * k * (3 - 2 * k);
      }
      function washFront(worldX, t) {
        let y = SHORE, best = 0;
        for (const w of WAVES) {
          const pr = waveProgress(w, t);
          if (pr > 0) {
            const wob = 9 * Math.sin(worldX * 0.0042 + w.s * 3.1) + 5 * Math.sin(worldX * 0.011 + w.s);
            const yy = SHORE + (w.reach - SHORE + wob) * pr;
            if (yy > y) { y = yy; best = pr; }
          }
        }
        return { y, pr: best };
      }
      // time when water first reaches level y after time t0 (or Infinity)
      function washedAfter(worldX, y, t0) {
        for (const w of WAVES) {
          const peak = w.s + RUN_UP;
          if (peak <= t0) continue;
          const wob = 9 * Math.sin(worldX * 0.0042 + w.s * 3.1) + 5 * Math.sin(worldX * 0.011 + w.s);
          if (w.reach + wob >= y) {
            // solve progress = (y - SHORE)/(reach-SHORE)
            const need = clamp((y - SHORE) / (w.reach + wob - SHORE), 0, 1);
            const k = 1 - Math.pow(1 - need, 1 / 2.4);
            return w.s + k * RUN_UP;
          }
        }
        return Infinity;
      }

      // ---------- scenery (seeded) ----------
      const rnd = mulberry32(7);
      const shells = [];
      for (let i = 0; i < 70; i++) {
        shells.push({ x: rnd() * 4200 - 300, y: 905 + rnd() * 170, r: 2 + rnd() * 4, a: 0.25 + rnd() * 0.35 });
      }
      const clouds = [
        { x: 260, y: 170, w: 360, h: 34 }, { x: 760, y: 240, w: 520, h: 26 },
        { x: 1500, y: 140, w: 440, h: 30 }, { x: 1180, y: 330, w: 300, h: 16 },
        { x: 1760, y: 300, w: 380, h: 20 },
      ];
      const gulls = [
        { x: 420, y: 455, s: 1.0, ph: 0.0, v: 26 }, { x: 500, y: 425, s: 0.8, ph: 1.7, v: 30 },
        { x: 1580, y: 410, s: 0.6, ph: 0.6, v: 18 },
      ];

      function drawSky(t) {
        const g = ctx.createLinearGradient(0, 0, 0, HORIZON);
        g.addColorStop(0, "#2a2a5e");
        g.addColorStop(0.38, "#7b4f86");
        g.addColorStop(0.68, "#e07b6a");
        g.addColorStop(0.9, "#f7b27a");
        g.addColorStop(1, "#ffd59a");
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, HORIZON + 2);
        // sun sinking slowly
        const sunX = 1390, sunY = 470 + t * 4.2, sunR = 74;
        const glow = ctx.createRadialGradient(sunX, sunY, sunR * 0.4, sunX, sunY, sunR * 6);
        glow.addColorStop(0, "rgba(255,226,170,0.75)");
        glow.addColorStop(0.25, "rgba(255,190,130,0.28)");
        glow.addColorStop(1, "rgba(255,160,120,0)");
        ctx.fillStyle = glow; ctx.fillRect(0, 0, W, HORIZON);
        ctx.save();
        ctx.beginPath(); ctx.rect(0, 0, W, HORIZON); ctx.clip();
        ctx.fillStyle = "#fff0c8";
        ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        // clouds drifting, lit from below
        for (const c of clouds) {
          const cx = c.x + t * 6;
          ctx.fillStyle = "rgba(255,170,150,0.22)";
          ctx.beginPath(); ctx.ellipse(cx, c.y, c.w / 2, c.h / 2, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "rgba(255,214,170,0.18)";
          ctx.beginPath(); ctx.ellipse(cx + c.w * 0.08, c.y + c.h * 0.3, c.w * 0.38, c.h * 0.32, 0, 0, Math.PI * 2); ctx.fill();
        }
        return { sunX, sunY };
      }

      function drawFar(t, cam) {
        // distant headland on the left, slight parallax
        const off = -cam * 0.06;
        ctx.fillStyle = "#4a3458";
        ctx.beginPath();
        ctx.moveTo(-50 + off, HORIZON + 1);
        ctx.bezierCurveTo(60 + off, HORIZON - 70, 190 + off, HORIZON - 96, 330 + off, HORIZON - 58);
        ctx.bezierCurveTo(420 + off, HORIZON - 34, 520 + off, HORIZON - 20, 640 + off, HORIZON + 1);
        ctx.closePath(); ctx.fill();
        // a small sailboat far out
        const bx = 980 - cam * 0.04 + t * 3, by = HORIZON + 10;
        ctx.fillStyle = "#3f2c4f";
        ctx.beginPath(); ctx.moveTo(bx, by - 46); ctx.lineTo(bx, by - 4); ctx.lineTo(bx + 28, by - 4); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(bx - 3, by - 38); ctx.lineTo(bx - 3, by - 4); ctx.lineTo(bx - 20, by - 4); ctx.closePath(); ctx.fill();
        ctx.fillRect(bx - 22, by - 3, 54, 5);
      }

      function drawGulls(t, cam) {
        ctx.strokeStyle = "rgba(60,40,70,0.85)"; ctx.lineCap = "round"; ctx.lineWidth = 3.2;
        for (const g of gulls) {
          const x = g.x + g.v * t - cam * 0.12, y = g.y + 8 * Math.sin(t * 0.9 + g.ph);
          const flap = Math.sin(t * 7 + g.ph * 3);
          const s = 20 * g.s, wy = flap * 9 * g.s;
          ctx.beginPath();
          ctx.moveTo(x - s, y - wy);
          ctx.quadraticCurveTo(x - s * 0.45, y - 6 * g.s - wy * 0.3, x, y);
          ctx.quadraticCurveTo(x + s * 0.45, y - 6 * g.s - wy * 0.3, x + s, y - wy);
          ctx.stroke();
        }
      }

      function drawSea(t, cam, sun) {
        const g = ctx.createLinearGradient(0, HORIZON, 0, SHORE + 10);
        g.addColorStop(0, "#c77a86");
        g.addColorStop(0.35, "#8a5d86");
        g.addColorStop(1, "#5a4a78");
        ctx.fillStyle = g; ctx.fillRect(0, HORIZON, W, SHORE - HORIZON + 12);
        // sun path shimmer
        for (let i = 0; i < 26; i++) {
          const yy = HORIZON + 6 + i * 5.6;
          const spread = 30 + i * 9;
          const k = 0.5 + 0.5 * Math.sin(t * 2.6 + i * 1.7);
          const w = spread * (0.35 + 0.65 * k);
          const xo = 18 * Math.sin(t * 1.3 + i * 0.9);
          ctx.fillStyle = `rgba(255,220,170,${0.18 + 0.4 * k * (1 - i / 30)})`;
          ctx.fillRect(sun.sunX - w / 2 + xo, yy, w, 2.4);
        }
        // swell lines moving in
        ctx.strokeStyle = "rgba(255,210,200,0.22)"; ctx.lineWidth = 2;
        for (let i = 0; i < 5; i++) {
          const u = ((t * 0.18 + i / 5) % 1);
          const yy = HORIZON + 30 + u * (SHORE - HORIZON - 30);
          ctx.globalAlpha = Math.sin(u * Math.PI);
          ctx.beginPath();
          for (let x = 0; x <= W; x += 40) {
            const wx = x + cam * 0.4;
            const y2 = yy + 3 * Math.sin(wx * 0.006 + i);
            if (x === 0) ctx.moveTo(x, y2); else ctx.lineTo(x, y2);
          }
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }

      function drawSand(t, cam) {
        const g = ctx.createLinearGradient(0, SHORE, 0, H);
        g.addColorStop(0, "#9a6a78");   // wet, reflecting the sky
        g.addColorStop(0.28, "#c98b7a");
        g.addColorStop(0.5, "#dea27f");
        g.addColorStop(1, "#c8875f");
        ctx.fillStyle = g; ctx.fillRect(0, SHORE, W, H - SHORE);
        // wet-sand sheen
        const sh = ctx.createLinearGradient(0, SHORE, 0, 900);
        sh.addColorStop(0, "rgba(255,200,170,0.28)");
        sh.addColorStop(1, "rgba(255,200,170,0)");
        ctx.fillStyle = sh; ctx.fillRect(0, SHORE, W, 900 - SHORE);
        for (const s of shells) {
          const x = s.x - cam;
          if (x < -10 || x > W + 10) continue;
          ctx.fillStyle = `rgba(255,236,214,${s.a})`;
          ctx.beginPath(); ctx.ellipse(x, s.y, s.r * 1.4, s.r * 0.7, 0, 0, Math.PI * 2); ctx.fill();
        }
      }

      function drawWash(t, cam) {
        // water sheet + foam edge
        const pts = [];
        for (let x = -20; x <= W + 20; x += 20) pts.push([x, washFront(x + cam, t).y]);
        ctx.fillStyle = "rgba(120,110,160,0.42)";
        ctx.beginPath(); ctx.moveTo(-20, SHORE - 4);
        for (const [x, y] of pts) ctx.lineTo(x, y);
        ctx.lineTo(W + 20, SHORE - 4); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = "rgba(255,245,236,0.8)"; ctx.lineWidth = 4; ctx.lineJoin = "round";
        ctx.beginPath();
        pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
        ctx.stroke();
        ctx.strokeStyle = "rgba(255,245,236,0.35)"; ctx.lineWidth = 2;
        ctx.beginPath();
        pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y - 9 - 4 * Math.sin(x * 0.03 + t * 2)) : ctx.moveTo(x, y - 9)));
        ctx.stroke();
      }

      function footprints(P, offsetX, footY, t, cam, depthScale) {
        const half = P.cycle / 2;
        const curX = dadX(t) + offsetX;
        const n0 = Math.ceil((X0 + offsetX - 40) / half);
        const n1 = Math.floor((curX - 20) / half);
        for (let n = n0; n <= n1; n++) {
          const wx = n * half + (n % 2 ? 8 : -2);
          const sx = wx - cam;
          if (sx < -30 || sx > W + 30) continue;
          const tp = (wx - offsetX - X0) / SPEED;
          const age = t - tp;
          let a = 0.42 * Math.min(1, age / 0.3) * Math.exp(-age / 9);
          const py = footY + (n % 2 ? 3 : -3) * depthScale;
          const tw = washedAfter(wx, py, tp);
          if (t > tw) a *= 1 - smooth(tw, tw + 0.8, t);
          if (a <= 0.01) continue;
          ctx.fillStyle = `rgba(110,62,72,${a})`;
          ctx.beginPath(); ctx.ellipse(sx + 6, py, 13 * depthScale, 4.2 * depthScale, 0, 0, Math.PI * 2); ctx.fill();
        }
      }

      function drawPair(t, cam, color, mirror) {
        const dx = dadX(t) - cam;
        const gx = dx + GIRL_AHEAD;
        const pd = (dadX(t) / DAD.cycle) * Math.PI * 2;
        const pg = ((dadX(t) + GIRL_AHEAD) / GIRL.cycle) * Math.PI * 2 + 0.7;
        const lift = girlLift(t);
        // hands meet between dad's shoulder and the girl's shoulder
        const ds = dadShoulder(dx, DAD_Y, pd);
        const gs = girlShoulder(gx, GIRL_Y, pg, lift);
        const swing = 6 * Math.sin(pd);
        const hand = { x: ds.x + 40 + swing, y: ds.y + 134 + 3 * Math.sin(pd) - 0.5 * lift };
        drawDad(dx, DAD_Y, pd, hand, color);
        drawGirl(gx, GIRL_Y, pg, lift, hand, t, color);
      }

      function draw(t) {
        t = clamp(t, 0, DUR);
        const cam = camX(t);
        ctx.clearRect(0, 0, W, H);
        const sun = drawSky(t);
        drawGulls(t, cam);
        drawFar(t, cam);
        drawSea(t, cam, sun);
        drawSand(t, cam);
        footprints(DAD, 0, DAD_Y, t, cam, 1);
        footprints(GIRL, GIRL_AHEAD, GIRL_Y, t, cam, 0.7);

        // reflection on wet sand
        ctx.save();
        ctx.beginPath(); ctx.rect(0, DAD_Y - 6, W, 120); ctx.clip();
        ctx.globalAlpha = 0.11;
        ctx.translate(0, 2 * DAD_Y + 6); ctx.scale(1, -1);
        drawPair(t, cam, "#2a1b33", true);
        ctx.restore();

        drawWash(t, cam);

        // the pair, with a warm rim
        ctx.save();
        ctx.shadowColor = "rgba(255,170,110,0.55)"; ctx.shadowBlur = 14;
        drawPair(t, cam, "#2a1b33", false);
        ctx.restore();

        // gentle warm vignette, deepening at the end
        const end = smooth(14.4, 16, t);
        const v = ctx.createRadialGradient(W / 2, H * 0.55, H * 0.35, W / 2, H * 0.55, H * 1.05);
        v.addColorStop(0, "rgba(30,15,40,0)");
        v.addColorStop(1, `rgba(30,15,40,${0.45 + 0.25 * end})`);
        ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
        // fade in from dark
        const fin = 1 - smooth(0, 1.2, t);
        if (fin > 0) { ctx.fillStyle = `rgba(20,12,32,${fin})`; ctx.fillRect(0, 0, W, H); }
      }

      // ---------- clock ----------
      window.addEventListener("hf-seek", (e) => draw(e.detail.time));
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(state, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(state.t) }, 0);
      tl.fromTo("#playa-title", { opacity: 0, y: 24, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.6, ease: "power2.out" }, 11.8);
      tl.fromTo("#playa-sub", { opacity: 0, y: 12 },
        { opacity: 0.85, y: 0, duration: 1.4, ease: "power2.out" }, 12.6);
      draw(0);
      window.__timelines["playa"] = tl;
    })();
  </script>
</template>
