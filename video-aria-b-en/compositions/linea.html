        tl.fromTo(to, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power2.out" }, t + 0.1);

      swap("#ln-p2", "#ln-p3", 14.9);
      swap("#ln-p3", "#ln-p4", 20.3);
      swap("#ln-p4", "#ln-p5", 25.7);
