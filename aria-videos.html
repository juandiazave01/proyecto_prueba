<title>ARIA Video Reel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Inter:wght@400;600;800&display=swap">
<style>
  /* Layout: one column of three films, ARIA's own night palette; a language switch at the top. Deliberately single dark theme, like ARIA. */
  :root {
    color-scheme: dark;
    --bg: #020617;
    --panel: #0f172a;
    --line: #1e293b;
    --fg: #e2e8f0;
    --muted: #94a3b8;
    --accent: #22d3ee;
    --font-mono: "IBM Plex Mono", ui-monospace, "Courier New", monospace;
    --font-body: "Inter", system-ui, -apple-system, sans-serif;
  }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); }
  .wrap { max-width: 1040px; margin: 0 auto; padding-block: 40px 64px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 32px; }
  .mark { font: 700 clamp(34px, 6vw, 52px)/1 var(--font-mono); color: var(--accent); letter-spacing: 0.06em; display: flex; align-items: center; gap: 14px; }
  .ring { width: 0.72em; height: 0.72em; border: 0.1em solid var(--accent); border-radius: 50%; position: relative; flex: none; }
  .ring::after { content: ""; position: absolute; inset: 22%; border-radius: 50%; background: var(--accent); }
  .sub { margin-top: 10px; font: 500 13px var(--font-mono); color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .lang button { background: transparent; color: var(--muted); border: 0; padding: 10px 18px; font: 700 14px var(--font-mono); letter-spacing: 0.08em; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--panel); color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  .lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .films { display: grid; gap: 36px; }
  .film { display: grid; gap: 14px; }
  .film video { width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; border: 1px solid var(--line); display: block; }
  .meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
  .meta h2 { margin: 0; font: 800 22px/1.2 var(--font-body); text-wrap: balance; }
  .meta .tag { font: 700 13px var(--font-mono); color: var(--accent); letter-spacing: 0.1em; }
  .meta .len { font: 500 13px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .film p { margin: 0; color: var(--muted); line-height: 1.55; max-width: 68ch; }
  footer { margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; line-height: 1.6; }
</style>

<div class="wrap">
  <header>
    <div>
      <div class="mark"><span class="ring" aria-hidden="true"></span>ARIA</div>
      <div class="sub" id="sub">Line 4 — Spuntech · 3 videos</div>
    </div>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button id="btn-es" type="button" aria-pressed="true">ES</button>
      <button id="btn-en" type="button" aria-pressed="false">EN</button>
    </div>
  </header>

  <main class="films" id="films"></main>

  <footer id="foot"></footer>
</div>

<script>
  const FILMS = [
    { tag: "A", len: "0:38",
      es: { title: "Turno de noche", src: "videos/a-es.mp4", text: "02:47, el relé Pilz del Gabinete 30 marca FAULT. ARIA lleva al técnico del síntoma a la guía de fallas y al plano." },
      en: { title: "Night Shift", src: "videos/a-en.mp4", text: "02:47, the Pilz relay in Cabinet 30 shows FAULT. ARIA takes the technician from the symptom to the fault guide and the drawing." } },
    { tag: "B", len: "0:43",
      es: { title: "La Línea 4 en el bolsillo", src: "videos/b-es.mp4", text: "Un recorrido continuo por la línea: cada máquina se abre en su pantalla real de ARIA." },
      en: { title: "Line 4 in your pocket", src: "videos/b-en.mp4", text: "One continuous tour of the line: every machine opens into its real ARIA screen." } },
    { tag: "C", len: "0:36",
      es: { title: "El conocimiento que no se va a casa", src: "videos/c-es.mp4", text: "Correos, planos, hojas sueltas y notas adhesivas terminan ordenados en ARIA." },
      en: { title: "Know-how no longer goes home", src: "videos/c-en.mp4", text: "Email, drawings, loose sheets and sticky notes end up organised inside ARIA." } },
  ];
  const UI = {
    es: { sub: "Line 4 — Spuntech · 3 videos", foot: "Música generada con MusicGen. Las pantallas y los datos son de ARIA v6; las escenas de planta están dramatizadas." },
    en: { sub: "Line 4 — Spuntech · 3 videos", foot: "Music generated with MusicGen. Screens and figures come from ARIA v6; the plant scenes are dramatised." },
  };
  const films = document.getElementById("films");
  function render(lang) {
    films.innerHTML = "";
    FILMS.forEach((f) => {
      const t = f[lang];
      const el = document.createElement("article");
      el.className = "film";
      el.innerHTML = `<video controls playsinline preload="metadata" src="${t.src}"></video>
        <div class="meta"><span class="tag">${f.tag}</span><h2>${t.title}</h2><span class="len">${f.len}</span></div>
        <p>${t.text}</p>`;
      films.appendChild(el);
    });
    document.getElementById("sub").textContent = UI[lang].sub;
    document.getElementById("foot").textContent = UI[lang].foot;
    document.documentElement.lang = lang;
    document.getElementById("btn-es").setAttribute("aria-pressed", lang === "es");
    document.getElementById("btn-en").setAttribute("aria-pressed", lang === "en");
    try { localStorage.setItem("aria-reel-lang", lang); } catch (e) {}
  }
  document.getElementById("btn-es").addEventListener("click", () => render("es"));
  document.getElementById("btn-en").addEventListener("click", () => render("en"));
  let start = "es";
  try { start = localStorage.getItem("aria-reel-lang") || "es"; } catch (e) {}
  render(start === "en" ? "en" : "es");
</script>
